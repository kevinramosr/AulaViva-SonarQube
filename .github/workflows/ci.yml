name: AulaViva S08 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
    quality:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: xdebug
          tools: composer:v2

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verificar sintaxis PHP
        shell: bash
        run: |
          find api config tests -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l

      - name: Ejecutar PHPUnit y generar cobertura
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Verificar cobertura mínima del 70%
        run: |
          php -r '
          $xml = simplexml_load_file("coverage.xml");

          if ($xml === false) {
              fwrite(STDERR, "No se pudo leer coverage.xml\n");
              exit(1);
          }

          $metrics = $xml->project->metrics;
          $total = (int) $metrics["statements"];
          $covered = (int) $metrics["coveredstatements"];

          if ($total === 0) {
              fwrite(STDERR, "No hay líneas para medir cobertura\n");
              exit(1);
          }

          $coverage = ($covered / $total) * 100;
          printf("Cobertura real: %.2f%%\n", $coverage);

          if ($coverage < 70) {
              fwrite(STDERR, "ERROR: cobertura inferior al 70%\n");
              exit(1);
          }

          echo "Cobertura aprobada.\n";
          '

      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/php"

    build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/kulkatpop/aulaviva-api:${{ github.sha }}

  
  promote:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio GitOps
        uses: actions/checkout@v4
        with:
          repository: kevinramosr/AulaViva-GitOps
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Actualizar imagen de DEV
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("overlays/dev/kustomization.yaml")
          content = path.read_text()

          updated, count = re.subn(
              r"(?m)^(\s*newTag:\s*).*$",
              lambda match: match.group(1) + os.environ["IMAGE_TAG"],
              content,
          )

          if count != 1:
              raise SystemExit("No se encontró exactamente un newTag en DEV")

          path.write_text(updated)
          PY

      - name: Crear Pull Request en GitOps
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          branch: automation/update-dev-image
          delete-branch: true
          commit-message: "chore(gitops): actualizar imagen DEV"
          title: "chore(gitops): actualizar imagen AulaViva DEV"
          body: |
            Promoción automática generada desde AulaViva S08.

            Imagen: ghcr.io/kulkatpop/aulaviva-api:${{ github.sha }}

            Entorno: DEV
          base: main
